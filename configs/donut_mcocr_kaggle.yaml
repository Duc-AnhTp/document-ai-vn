experiment: "mcocr_finetune_kaggle"

model:
  pretrained: "/kaggle/working/results/e2_donut/checkpoints/cord_warmup"
  max_length: 768
  image_size: [1280, 960]
  task_prompt: "<s_mcocr>"
  added_tokens:
    - "<s_mcocr>"
    - "<s_store_name>"
    - "</s_store_name>"
    - "<s_date>"
    - "</s_date>"
    - "<s_total>"
    - "</s_total>"
    - "<s_address>"
    - "</s_address>"

data:
  train_dir: "/kaggle/input/mcocr-donut-format/donut_format/train"
  val_dir: "/kaggle/input/mcocr-donut-format/donut_format/val"
  test_dir: "/kaggle/input/mcocr-donut-format/donut_format/test"

training:
  epochs: 30
  batch_size: 4
  learning_rate: 3e-5
  gradient_accumulation: 4
  early_stopping_patience: 5
  precision: "fp16"
  multi_gpu: true
  num_workers: 2
  pin_memory: true
  resume: true

output:
  checkpoint_dir: "/kaggle/working/results/e2_donut/checkpoints/mcocr"
  log_file: "/kaggle/working/results/e2_donut/training_log.csv"

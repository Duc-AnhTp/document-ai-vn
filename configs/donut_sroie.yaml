experiment: "sroie_cross"

model:
  pretrained: "results/e2_donut/checkpoints/mcocr"
  max_length: 768
  task_prompt: "<s_sroie>"

data:
  train_dir: "data/sroie/donut_format/train"
  val_dir: "data/sroie/donut_format/val"
  test_dir: "data/sroie/donut_format/test"
  image_size: [1280, 960]

training:
  epochs: 10
  batch_size: 2
  learning_rate: 1e-5
  warmup_steps: 50
  gradient_accumulation: 8

output:
  checkpoint_dir: "results/e3_cross/checkpoints"
  log_file: "results/e3_cross/training_log.csv"

experiment: "mcocr_finetune"

model:
  pretrained: "results/e2_donut/checkpoints/cord_warmup"
  max_length: 768
  task_prompt: "<s_mcocr>"
  added_tokens:
    - "<s_store_name>"
    - "</s_store_name>"
    - "<s_date>"
    - "</s_date>"
    - "<s_total>"
    - "</s_total>"
    - "<s_address>"
    - "</s_address>"

data:
  train_dir: "data/mc-ocr/donut_format/train"
  val_dir: "data/mc-ocr/donut_format/val"
  test_dir: "data/mc-ocr/donut_format/test"
  image_size: [1280, 960]

training:
  epochs: 30
  batch_size: 2
  learning_rate: 3e-5
  warmup_steps: 100
  gradient_accumulation: 8
  early_stopping_patience: 5

output:
  checkpoint_dir: "results/e2_donut/checkpoints/mcocr"
  log_file: "results/e2_donut/training_log.csv"
